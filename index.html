<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wordlist Cleaner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Wordlist Cleaner</h1>
<p>Upload multiple .txt files. All processing happens locally in your browser.</p>

<div id="dropzone">Drop your wordlists here or click to select</div>
<input type="file" id="fileInput" multiple accept=".txt" style="display:none;">

<button id="processBtn">Process Wordlists</button>

<div id="preview" style="display:none; margin-top:20px;">
    <h3>Word Count Preview</h3>
    <p id="previewText"></p>
</div>

<div id="progressContainer" style="display:none;">
    <h3>Processing...</h3>
    <div id="progressBarOuter">
        <div id="progressBarInner"></div>
    </div>
    <div id="progressText"></div>
</div>

<div id="results" style="display:none;">
    <h2>Downloads</h2>
    <button id="downloadZip">Download ZIP (All Files)</button>
    <button id="downloadClean">Download Cleaned List</button>
    <button id="downloadRejected">Download Rejected Words</button>
    <button id="downloadStats">Download Stats Report</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    
<script src="script.js"></script>
</body>
</html>
